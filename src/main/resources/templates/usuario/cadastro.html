<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags para SEO -->
    <title>Cadastro - MeuInfluencer</title>
    <meta name="description" content="Cadastre-se na plataforma MeuInfluencer como Empresa ou Influenciador e conecte-se para parcerias incríveis.">
    <meta name="keywords" content="influenciadores, empresas, marketing de influência, cadastro, parcerias">
    <meta name="author" content="MeuInfluencer">
    
    <!-- Meta Tags para Redes Sociais (Open Graph) -->
    <meta property="og:title" content="Cadastro - MeuInfluencer">
    <meta property="og:description" content="Conecte empresas e influenciadores de forma rápida e segura. Crie sua conta agora!">
    <meta property="og:type" content="website">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilo personalizado com tema avermelhado escuro -->
    <style>
        body {
            background-color: #1a0f0f !important;
            color: #f8d7da;
        }
        .card-custom {
            background-color: #2c1515;
            border: 1px solid #492020;
            color: #f8d7da;
        }
        .form-control, .form-select {
            background-color: #1a0f0f;
            border-color: #5c2626;
            color: #fff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #1a0f0f;
            border-color: #a71d2a;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(167, 29, 42, 0.25);
        }
        .btn-custom {
            background-color: #a71d2a;
            border-color: #a71d2a;
            color: #fff;
        }
        .btn-custom:hover {
            background-color: #80141f;
            border-color: #80141f;
            color: #fff;
        }
        a {
            color: #ff6b6b;
        }
        a:hover {
            color: #ff8787;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card card-custom shadow-lg p-4 rounded-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4 fw-bold text-danger">Criar Conta</h3>
        
        <!-- Alertas de Sucesso ou Erro (Thymeleaf) -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${sucesso}"></span>
        </div>
        <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${mensagemErro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Formulário de Cadastro Único -->
        <form th:action="@{/auth/registrar}" method="POST">
            
            <!-- Campo E-mail -->
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <!-- Campo Senha -->
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Sua senha segura" required>
            </div>

            <!-- Tipo de Usuário -->
            <div class="mb-3">
                <label for="tipoUsuario" class="form-label">Tipo de Usuário</label>
                <select class="form-select" id="tipoUsuario" name="tipoUsuario" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="EMPRESA">Empresa</option>
                    <option value="INFLUENCER">Influencer</option>
                </select>
            </div>
            <div class="text-end mb-3">
                <a th:href="@{/auth/esqueci-senha}" class="small text-decoration-none">Esqueci minha senha</a>
            </div>

            <!-- Botão de Envio -->
            <button type="submit" class="btn btn-custom w-100 py-2 fw-semibold">Cadastrar</button>
        </form>

        <div class="mt-3 text-center">
            <a th:href="@{/}" class="btn btn-outline-light w-100 py-2 fw-semibold" style="border-color: #5c2626; color: #d1a1a1;">
                Voltar ao Início
            </a>
        </div>
        
        <div class="text-center mt-3">
            <small>Já tem uma conta? <a href="/login" class="text-decoration-none">Faça login</a></small>
        </div>
    </div>

</body>
</html>
