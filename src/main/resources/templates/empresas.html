<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Influencer | Empresas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen p-4 md:p-8">

<div class="max-w-6xl mx-auto">
    <header class="text-center mb-10 text-white">
        <h1 class="text-4xl font-bold mb-2"><i class="fas fa-building mr-2"></i>Portal de Empresas</h1>
        <p class="opacity-80">Gerencie marcas e parcerias corporativas</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <div class="lg:col-span-1">
            <div class="glass rounded-3xl p-8 shadow-2xl">
                <h2 class="text-2xl font-semibold mb-6 text-gray-800">Nova Empresa</h2>

                <form th:action="@{/empresa/adicionar}" th:object="${empresa}" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Nome da Empresa</label>
                        <input type="text" th:field="*{nome}" placeholder="Ex: Tech Solutions Ltda" required
                               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Segmento / Ramo</label>
                        <input type="text" th:field="*{segmento}" placeholder="Ex: Tecnologia, Moda..."
                               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">CNPJ</label>
                        <input type="text" th:field="*{cnpj}" placeholder="00.000.000/0000-00"
                               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Saldo</label>
                        <input type="text" th:field="*{saldo}" placeholder="00.000.000/0000-00"
                               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>

                    <h3 class="text-sm font-bold text-gray-500 uppercase mt-6 mb-2">Contato Principal</h3>
                    <div class="p-4 bg-blue-50 rounded-2xl space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-blue-700">E-mail Corporativo</label>
                            <input type="email" th:field="*{email}"
                                   class="w-full px-3 py-2 rounded-lg border-none focus:ring-2 focus:ring-blue-400 outline-none">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transform hover:-translate-y-1 transition duration-200">
                        Cadastrar Empresa <i class="fas fa-plus ml-2"></i>
                    </button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-2">
            <div class="glass rounded-3xl shadow-2xl overflow-hidden">
                <div class="p-6 bg-white/50 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800">Parceiros Registrados</h2>
                    <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full"
                          th:text="${#lists.size(empresas)} + ' REGISTRADAS'">0 REGISTRADAS</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50/50 text-gray-500 text-sm uppercase">
                        <tr>
                            <th class="px-6 py-4">Empresa</th>
                            <th class="px-6 py-4">Segmento</th>
                            <th class="px-6 py-4 text-right">Ações</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                        <tr th:each="emp : ${empresas}" class="hover:bg-white/40 transition">
                            <td class="px-6 py-4">
                                <div class="flex items-center">
                                    <div class="h-10 w-10 rounded-full bg-gradient-to-tr from-blue-400 to-cyan-400 flex items-center justify-center text-white font-bold mr-3 shadow-md">
                                        <span th:text="${#strings.substring(emp.nome,0,1)}">E</span>
                                    </div>
                                    <div>
                                        <div class="font-semibold text-gray-700" th:text="${emp.nome}">Nome da Empresa</div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 rounded-lg bg-gray-100 text-gray-600 font-medium text-sm"
                                      th:text="${emp.segmento}">Varejo</span>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <a th:href="@{/empresa/deletar/{id}(id=${emp.id})}" class="text-red-400 hover:text-red-600 transition p-2">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(empresas)}">
                            <td colspan="3" class="px-6 py-10 text-center text-gray-400 italic">
                                Nenhuma empresa cadastrada ainda.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
