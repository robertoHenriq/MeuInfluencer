<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Influencer | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #991b1b 0%, #ef4444 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen p-4 md:p-8 flex items-center justify-center">

<div class="max-w-xl w-full mx-auto">
    <header class="text-center mb-8 text-white">
        <h1 class="text-4xl font-bold mb-2"><i class="fas fa-star mr-2"></i>Meu Influencer</h1>
        <p class="opacity-90">Gerencie sua rede de estrelas com estilo</p>
    </header>

    <div class="glass rounded-3xl p-8 shadow-2xl">
        <h2 class="text-2xl font-semibold mb-6 text-gray-800 flex items-center">
            <i class="fas fa-user-plus text-red-500 mr-2"></i> Novo Cadastro
        </h2>

        <form th:action="@{/influencer/adicionar}" th:object="${influencer}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Nome do Influencer</label>
                <input type="text" th:field="*{nome}" placeholder="Ex: Roberto Henriq"
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-red-500 outline-none transition shadow-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Total de Seguidores</label>
                <input type="number" th:field="*{seguidores}" placeholder="Ex: 50000" min="0" required
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-red-500 outline-none transition shadow-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Categorias / Nichos</label>
                <select th:field="*{categorias}" multiple class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-red-500 outline-none transition shadow-sm" style="height: 120px;">
                    <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                </select>
                <small class="text-gray-400 block mt-1">Segure Ctrl para selecionar mais de uma.</small>
            </div>
            
            <h3 class="text-sm font-bold text-gray-500 uppercase mt-6 mb-2 tracking-wide">Redes Sociais</h3>
            <div class="p-4 bg-red-50 rounded-2xl space-y-3 border border-red-100">
                <div>
                    <label class="block text-xs font-semibold text-red-700 mb-1">Plataforma (ex: Instagram)</label>
                    <input type="text" th:field="*{redesSociais[0].nome}" required placeholder="Instagram"
                           class="w-full px-3 py-2 rounded-lg border border-red-200 focus:ring-2 focus:ring-red-400 outline-none bg-white">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-red-700 mb-1">Seguidores</label>
                        <input type="number" th:field="*{redesSociais[0].quantidadeDeSeguidores}" required min="0" placeholder="10000"
                               class="w-full px-3 py-2 rounded-lg border border-red-200 focus:ring-2 focus:ring-red-400 outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-red-700 mb-1">Link do Perfil</label>
                        <input type="url" th:field="*{redesSociais[0].linkDoPerfil}" required placeholder="https://..."
                               class="w-full px-3 py-2 rounded-lg border border-red-200 focus:ring-2 focus:ring-red-400 outline-none bg-white">
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl shadow-lg transform hover:-translate-y-0.5 active:translate-y-0 transition duration-200 flex items-center justify-center">
                Cadastrar Agora <i class="fas fa-rocket ml-2"></i>
            </button>
        </form>
        <div class="mb-6">
            <a href="/" 
            class="inline-flex items-center px-4 py-2 bg-white/80 hover:bg-white text-red-700 text-sm font-semibold rounded-xl shadow-md backdrop-blur-md transition duration-200 transform hover:-translate-x-1">
                <i class="fas fa-arrow-left mr-2"></i> Voltar ao Início
            </a>
        </div>

    </div>
    
</div>

</body>
</html>
