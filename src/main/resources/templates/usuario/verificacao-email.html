<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags -->
    <title>Verificação de E-mail - MeuInfluencer</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilo personalizado com tema avermelhado escuro -->
    <style>
        body {
            background-color: #1a0f0f !important;
            color: #f8d7da;
        }
        .card-custom {
            background-color: #2c1515;
            border: 1px solid #492020;
            color: #f8d7da;
        }
        .code-input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #1a0f0f;
            border: 1px solid #5c2626;
            color: #fff;
            border-radius: 8px;
        }
        .code-input:focus {
            background-color: #1a0f0f;
            border-color: #a71d2a;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(167, 29, 42, 0.25);
            outline: none;
        }
        .btn-custom {
            background-color: #a71d2a;
            border-color: #a71d2a;
            color: #fff;
        }
        .btn-custom:hover {
            background-color: #80141f;
            border-color: #80141f;
            color: #fff;
        }
        a {
            color: #ff6b6b;
        }
        a:hover {
            color: #ff8787;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card card-custom shadow-lg p-4 rounded-4 text-center" style="width: 100%; max-width: 420px;">
        <h3 class="fw-bold text-danger mb-3">Verifique seu E-mail</h3>
        <p class="text-muted small mb-4" style="color: #d1a1a1 !important;">
            Enviamos um código de 4 dígitos para o seu e-mail cadastrado. Digite-o abaixo para ativar sua conta.
        </p>
        
        <!-- Formulário de Verificação -->
        <form th:action="@{/auth/verificar-codigo}" method="POST" id="formVerificacao">
            
            <!-- 4 Espaços para o Código com 'name' individuais -->
            <div class="d-flex justify-content-center gap-2 mb-4">
                <input type="text" class="form-control code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d1" required autofocus>
                <input type="text" class="form-control code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d2" required>
                <input type="text" class="form-control code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d3" required>
                <input type="text" class="form-control code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="d4" required>
            </div>

            <!-- Campo oculto que vai juntar os 4 números em uma string única -->
            <input type="hidden" id="codigoCompleto" name="codigo">

            <!-- Botão de Confirmação -->
            <button type="submit" class="btn btn-custom w-100 py-2 fw-semibold">Confirmar Código</button>
        </form>

        <div class="mt-3 text-center">
            <a th:href="@{/}" class="btn btn-outline-light w-100 py-2 fw-semibold" style="border-color: #5c2626; color: #d1a1a1;">
                Cancelar
            </a>
        </div>
        
        <div class="mt-4">
            <small class="text-muted" style="color: #d1a1a1 !important;">Não recebeu o código? <a href="#" class="text-decoration-none">Reenviar</a></small>
        </div>
    </div>

    <!-- Script opcional simples para pular para o próximo campo automaticamente --><script>
        const inputs = document.querySelectorAll('.code-input');
        const form = document.getElementById('formVerificacao');
        const codigoCompletoInput = document.getElementById('codigoCompleto');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Junta os 4 números em um só antes de enviar o formulário para o Java
        form.addEventListener('submit', (e) => {
            let codigoFinal = '';
            inputs.forEach(input => {
                codigoFinal += input.value;
            });
            codigoCompletoInput.value = codigoFinal;
        });
    </script>   

</body>
</html>
