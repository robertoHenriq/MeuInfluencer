<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags para SEO -->
    <title>Login - MeuInfluencer</title>
    <meta name="description" content="Acesse sua conta na plataforma MeuInfluencer para gerenciar suas parcerias entre empresas e influenciadores.">
    <meta name="robots" content="noindex, nofollow"> <!-- Páginas de login não devem ser indexadas pelo Google -->

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilo personalizado com tema avermelhado escuro -->
    <style>
        body {
            background-color: #1a0f0f !important;
            color: #f8d7da;
        }
        .card-custom {
            background-color: #2c1515;
            border: 1px solid #492020;
            color: #f8d7da;
        }
        .form-control {
            background-color: #1a0f0f;
            border-color: #5c2626;
            color: #fff;
        }
        .form-control:focus {
            background-color: #1a0f0f;
            border-color: #a71d2a;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(167, 29, 42, 0.25);
        }
        .btn-custom {
            background-color: #a71d2a;
            border-color: #a71d2a;
            color: #fff;
        }
        .btn-custom:hover {
            background-color: #80141f;
            border-color: #80141f;
            color: #fff;
        }
        a {
            color: #ff6b6b;
        }
        a:hover {
            color: #ff8787;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card card-custom shadow-lg p-4 rounded-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4 fw-bold text-danger">Entrar na Conta</h3>
        
        <!-- Alerta de Erro de Login (caso o Spring Security retorne erro) -->
        <div th:if="${param.error}" class="alert alert-danger py-2 text-center" role="alert">
            E-mail ou senha inválidos.
        </div>

        <!-- Alerta de Logout -->
        <div th:if="${param.logout}" class="alert alert-success py-2 text-center" role="alert">
            Você saiu com sucesso.
        </div>
        
        <!-- Formulário de Login -->
        <form th:action="@{/login}" method="POST">
            
            <!-- Campo E-mail (username no Spring Security) -->
            <div class="mb-3">
                <label for="username" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="username" name="username" placeholder="seu@email.com" required autofocus>
            </div>

            <!-- Campo Senha -->
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Sua senha" required>
            </div>

            <!-- Botão de Envio -->
            <button type="submit" class="btn btn-custom w-100 py-2 fw-semibold">Entrar</button>
        </form>

        <div class="mt-3 text-center">
            <a th:href="@{/}" class="btn btn-outline-light w-100 py-2 fw-semibold" style="border-color: #5c2626; color: #d1a1a1;">
                Voltar ao Início
            </a>
        </div>

        <div class="text-center mt-3">
            <small>Não tem uma conta? <a href="/cadastro" class="text-decoration-none">Cadastre-se</a></small>
        </div>
    </div>

</body>
</html>
