<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Empresas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-red-950 via-rose-900 to-red-900 min-h-screen flex flex-col justify-between font-sans p-4 md:p-8">

    <!-- Container Principal Centralizado -->
    <main class="max-w-xl mx-auto px-4 py-6 w-full flex-grow flex flex-col justify-center">
        
        <!-- Botão de Voltar ao Início -->
        <div class="mb-6">
            <a href="/" 
               class="inline-flex items-center px-4 py-2 bg-white/10 hover:bg-white/20 text-white text-sm font-semibold rounded-xl shadow-md backdrop-blur-md transition duration-200 transform hover:-translate-x-1 border border-white/10">
                <i class="fas fa-arrow-left mr-2"></i> Voltar ao Início
            </a>
        </div>

        <div class="text-center mb-8 text-white">
            <h1 class="text-4xl font-extrabold tracking-tight">Painel de <span class="text-red-300">Empresas</span></h1>
            <p class="text-red-200 mt-2 text-sm opacity-90">Cadastre os novos parceiros corporativos, CNPJs e redes sociais.</p>
        </div>

        <!-- Formulário de Novo Cadastro -->
        <div class="glass rounded-3xl p-8 shadow-2xl border border-white/20">
            <div class="mb-6">
                <h2 class="text-xl font-bold text-gray-800 mb-1 flex items-center gap-2">
                    <i class="fa-solid fa-building text-red-700"></i> Cadastrar Nova Empresa
                </h2>
                <p class="text-gray-500 text-xs">Preencha os dados corporativos e as redes sociais.</p>
            </div>

            <!-- Formulário apontando para o endpoint POST do Controller -->
            <form th:action="@{/empresa/adicionar}" th:object="${empresa}" method="POST" class="space-y-4">
                
                <!-- Campo Nome -->
                <div>
                    <label for="nome" class="block text-xs font-semibold text-gray-700 mb-1">Nome da Empresa</label>
                    <input type="text" id="nome" th:field="*{nome}" required 
                        placeholder="Ex: Loja Paraibana de Calçados" 
                        class="w-full px-4 py-2.5 rounded-xl bg-white border border-gray-300 text-gray-800 focus:ring-2 focus:ring-red-600 focus:border-transparent outline-none transition text-sm shadow-sm">
                </div>

                <!-- Campo CNPJ -->
                <div>
                    <label for="cnpj" class="block text-xs font-semibold text-gray-700 mb-1">CNPJ</label>
                    <input type="text" id="cnpj" th:field="*{cnpj}" required 
                        placeholder="00.000.000/0001-00" 
                        class="w-full px-4 py-2.5 rounded-xl bg-white border border-gray-300 text-gray-800 focus:ring-2 focus:ring-red-600 focus:border-transparent outline-none transition text-sm shadow-sm">
                </div>

                <!-- Campo E-mail -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-gray-700 mb-1">E-mail Corporativo</label>
                    <input type="email" id="email" th:field="*{email}" required 
                        placeholder="contato@suaempresa.com" 
                        class="w-full px-4 py-2.5 rounded-xl bg-white border border-gray-300 text-gray-800 focus:ring-2 focus:ring-red-600 focus:border-transparent outline-none transition text-sm shadow-sm">
                </div>

                <!-- Campo Saldo Inicial -->
                <div>
                    <label for="saldo" class="block text-xs font-semibold text-gray-700 mb-1">Saldo Inicial (R$)</label>
                    <input type="number" step="0.01" id="saldo" th:field="*{saldo}" required 
                        placeholder="0.00" 
                        class="w-full px-4 py-2.5 rounded-xl bg-white border border-gray-300 text-gray-800 focus:ring-2 focus:ring-red-600 focus:border-transparent outline-none transition text-sm shadow-sm">
                </div>

                <!-- Seletor de Categoria/Nicho -->
                <div>
                    <label for="categoria" class="block text-xs font-semibold text-gray-700 mb-1">Categoria / Nicho de Atuação</label>
                    <select id="categoria" name="categoriaId" required
                        class="w-full px-4 py-2.5 rounded-xl bg-white border border-gray-300 text-gray-800 focus:ring-2 focus:ring-red-600 focus:border-transparent outline-none transition text-sm shadow-sm">
                        <option value="" disabled selected>Selecione um nicho...</option>
                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                    </select>
                </div>

                <!-- Seção de Redes Sociais Dinâmicas -->
                <div class="border-t border-red-100 pt-4 mt-4 bg-red-50/60 p-4 rounded-2xl">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-semibold text-red-800">Redes Sociais</label>
                        <button type="button" onclick="adicionarRedeSocial()" class="text-xs bg-red-100 text-red-700 hover:bg-red-200 font-bold px-2.5 py-1 rounded-lg transition">
                            <i class="fa-solid fa-plus"></i> Adicionar Rede
                        </button>
                    </div>
                    
                    <div id="redes-sociais-container" class="space-y-3">
                        <!-- Os inputs dinâmicos entram aqui via JavaScript -->
                    </div>
                </div>

                <!-- Botão de Envio -->
                <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-sm mt-6">
                    <i class="fa-solid fa-plus"></i> Salvar e Cadastrar Empresa
                </button>

            </form>
        </div>
    </main>

    <!-- Script para gerenciar a adição dinâmica de campos de redes sociais -->
    <script>
        let indexRede = 0;
        function adicionarRedeSocial() {
            const container = document.getElementById('redes-sociais-container');
            const html = `
                <div class="flex gap-2 items-center bg-white p-2.5 rounded-xl border border-red-200 shadow-sm">
                    <input type="text" name="redesSociais[${indexRede}].nome" placeholder="Plataforma (ex: Instagram)" required 
                        class="w-1/3 px-3 py-1.5 rounded-lg bg-gray-50 border border-gray-200 text-xs text-gray-800 outline-none focus:ring-1 focus:ring-red-600">
                    <input type="url" name="redesSociais[${indexRede}].linkDoPerfil" placeholder="Link do perfil (https://...)" required 
                        class="w-2/3 px-3 py-1.5 rounded-lg bg-gray-50 border border-gray-200 text-xs text-gray-800 outline-none focus:ring-1 focus:ring-red-600">
                    <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2 text-xs">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            indexRede++;
        }
    </script>

    <!-- Rodapé -->
    <footer class="text-center py-6 text-xs text-red-200/60">
        <p>© 2026 Sistema de Gerenciamento. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
