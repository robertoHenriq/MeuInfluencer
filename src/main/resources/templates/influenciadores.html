<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Influencer | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen p-4 md:p-8">

<div class="max-w-6xl mx-auto">
    <header class="text-center mb-10 text-white">
        <h1 class="text-4xl font-bold mb-2"><i class="fas fa-star mr-2"></i>Meu Influencer</h1>
        <p class="opacity-80">Gerencie sua rede de estrelas com estilo</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <div class="lg:col-span-1">
            <div class="glass rounded-3xl p-8 shadow-2xl">
                <h2 class="text-2xl font-semibold mb-6 text-gray-800">Novo Cadastro</h2>

                <form th:action="@{/influencer/adicionar}" th:object="${influencer}" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Nome do Influencer</label>
                        <input type="text" th:field="*{nome}" placeholder="Ex: Roberto Henriq"
                               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-purple-500 outline-none transition">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Total de Seguidores</label>
                        <input type="number" th:field="*{seguidores}" placeholder="Ex: 50000" min="0"
                               class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-purple-500 outline-none transition">
                    </div>

                    <h3 class="text-sm font-bold text-gray-500 uppercase mt-6 mb-2">Redes Sociais</h3>
                    <div class="p-4 bg-purple-50 rounded-2xl space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-purple-700">Plataforma (ex: Instagram)</label>
                            <input type="text" th:field="*{redesSociais[0].nome}"
                                   class="w-full px-3 py-2 rounded-lg border-none focus:ring-2 focus:ring-purple-400 outline-none">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-purple-700">Seguidores</label>
                                <input type="number" th:field="*{redesSociais[0].quantidadeDeSeguidores}"
                                       class="w-full px-3 py-2 rounded-lg border-none focus:ring-2 focus:ring-purple-400 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-purple-700">Link do Perfil</label>
                                <input type="text" th:field="*{redesSociais[0].linkDoPerfil}"
                                       class="w-full px-3 py-2 rounded-lg border-none focus:ring-2 focus:ring-purple-400 outline-none">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl shadow-lg transform hover:-translate-y-1 transition duration-200">
                        Cadastrar Agora <i class="fas fa-rocket ml-2"></i>
                    </button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-2">
            <div class="glass rounded-3xl shadow-2xl overflow-hidden">
                <div class="p-6 bga-white/50 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800">Influenciadores Ativos</h2>
                    <span class="bg-purple-100 text-purple-700 text-xs font-bold px-3 py-1 rounded-full"
                          th:text="${#lists.size(influenciadores)} + ' CADASTRADOS'">0 CADASTRADOS</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50/50 text-gray-500 text-sm uppercase">
                        <tr>
                            <th class="px-6 py-4">Influencer</th>
                            <th class="px-6 py-4 text-center">Seguidores</th>
                            <th class="px-6 py-4 text-right">Ações</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                        <tr th:each="inf : ${influenciadores}" class="hover:bg-white/40 transition">
                            <td class="px-6 py-4">
                                <div class="flex items-center">
                                    <div class="h-10 w-10 rounded-full bg-gradient-to-tr from-purple-400 to-pink-400 flex items-center justify-center text-white font-bold mr-3 shadow-md">
                                        <span th:text="${inf.nome != null and !inf.nome.isEmpty() ? #strings.substring(inf.nome, 0, 1) : '?' }"></span>                                    </div>
                                    <span class="font-semibold text-gray-700" th:text="${inf.nome}">Nome</span>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-center">
                                        <span class="px-3 py-1 rounded-lg bg-green-100 text-green-700 font-bold text-sm"
                                              th:text="${#numbers.formatInteger(inf.seguidores, 0, 'POINT')}">10k</span>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <a th:href="@{/influencer/deletar/{id}(id=${inf.id})}" class="text-red-400 hover:text-red-600 transition">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(influenciadores)}">
                            <td colspan="3" class="px-6 py-10 text-center text-gray-400 italic">
                                Nenhum influenciador encontrado. Comece cadastrando um ao lado!
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
